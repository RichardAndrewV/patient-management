spring.application.name=billing-service

server.port=4001
grpc.server.port=9001

#spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=billing-group-new-999
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=true

# ? KEY DESERIALIZER
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ? IMPORTANT: WRAP DESERIALIZER (THIS FIXES YOUR CRASH)
#spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# ? DELEGATE ACTUAL JSON DESERIALIZER
#spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# ? IGNORE TYPE HEADERS (CRITICAL FIX)
#spring.kafka.consumer.properties.spring.json.use.type.headers=false

# ? FORCE YOUR CLASS
#spring.kafka.consumer.properties.spring.json.value.default.type=com.pm.billingservice.event.PatientEvent

# ? TRUST PACKAGES
#spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ? PRODUCER (leave as is)
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
#spring.kafka.consumer.properties.spring.json.value.default.type=com.pm.billingservice.event.PatientEvent
spring.kafka.consumer.properties.spring.json.value.default.type=com.pm.common.event.PatientEvent
# ================== DATABASE CONFIG ==================

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.kafka.bootstrap-servers=kafka:9092